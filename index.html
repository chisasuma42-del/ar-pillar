<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR実景合成 - 強制視認版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; color: #fff; }
        #camera-video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        #ui {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); padding: 12px 24px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2); text-align: center; pointer-events: none; z-index: 10;
        }
        #ui h1 { font-size: 16px; margin: 0 0 4px 0; color: #00ffff; }
        #ui p { font-size: 12px; margin: 0; color: #ccc; }
        #debug-info {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px;
            font-family: monospace; font-size: 12px; color: #00ff00; z-index: 200; pointer-events: none;
        }
        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 16px 32px; font-size: 18px; font-weight: bold;
            background: linear-gradient(135deg, #00ffff, #0088ff); color: #000;
            border: none; border-radius: 50px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            cursor: pointer; z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <video id="camera-video" autoplay playsinline muted></video>

    <div id="ui">
        <h1>✨ 光の柱 演出シミュレーター</h1>
        <p>周囲を見回して光の柱を確認してください</p>
    </div>

    <div id="debug-info">
        Status: ボタンを押してください
    </div>

    <button id="start-btn" onclick="startAR()">タップして開始</button>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, mainPillar;
        const debugElem = document.getElementById('debug-info');

        let initialAlpha = null;
        let targetYaw = 0;
        let currentYaw = 0;

        function startAR() {
            document.getElementById('start-btn').style.display = 'none';

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            debugElem.innerHTML = "STATUS: センサー許可完了";
                            initSystem();
                        } else {
                            debugElem.innerHTML = "STATUS: センサー許可拒否";
                        }
                    })
                    .catch(err => { debugElem.innerHTML = "ERROR: " + err; });
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
                initSystem();
            }
        }

        async function initSystem() {
            await initCamera();
            if (!scene) initThree();
        }

        async function initCamera() {
            const video = document.getElementById('camera-video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                } catch (e) {
                    alert('カメラの許可が得られませんでした。');
                }
            }
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            // 視野角を大きめ（60度）に設定
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 0, 0); // カメラ位置を原点に固定

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            // 📍 超巨大な柱を1本作成
            createGiantPillar();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createGiantPillar() {
            mainPillar = new THREE.Group();

            const radius = 5.0;     // 太さを2倍に
            const height = 2000.0; // 上下に2000m伸ばす（絶対に見失わない高さ）

            // ① 外殻発光シリンダー
            const geometry = new THREE.CylinderGeometry(radius, radius, height, 32, 1, true);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.7,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const cylinder = new THREE.Mesh(geometry, material);
            cylinder.position.y = 0; // カメラの中心高さに跨がるように配置
            mainPillar.add(cylinder);

            // ② 芯の強い光
            const coreGeo = new THREE.CylinderGeometry(radius * 0.4, radius * 0.4, height, 16, 1, true);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = 0;
            mainPillar.add(core);

            // 正面20m先に配置
            mainPillar.position.set(0, 0, -20);
            scene.add(mainPillar);
        }

        function handleOrientation(event) {
            let alpha = event.alpha || 0;

            if (event.webkitCompassHeading) {
                alpha = event.webkitCompassHeading;
            }

            // 1回目の計測角度を正面基準にする
            if (initialAlpha === null) {
                initialAlpha = alpha;
            }

            let relativeAlpha = alpha - initialAlpha;
            targetYaw = THREE.MathUtils.degToRad(-relativeAlpha);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 左右パンのみ滑らかに更新（上下・傾きは一旦0で完全固定）
            currentYaw += (targetYaw - currentYaw) * 0.15;
            camera.rotation.set(0, currentYaw, 0, 'YXZ');

            if (debugElem) {
                debugElem.innerHTML = `STATUS: 強制表示モード動作中`;
            }

            if (mainPillar) mainPillar.rotation.y += 0.005;
            if (scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
