<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR実景合成（全方向追従＋水平補正） - 複数光柱</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
        }
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #ui h1 {
            font-size: 16px;
            margin: 0 0 4px 0;
            color: #00ffff;
        }
        #ui p {
            font-size: 12px;
            margin: 0;
            color: #ccc;
        }
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            border: none;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            cursor: pointer;
            z-index: 100;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <video id="camera-video" autoplay playsinline muted></video>

    <div id="ui">
        <h1>✨ AR実景合成（全方向追従）</h1>
        <p>スマホを上下左右に動かして光の柱を確認してください</p>
    </div>

    <button id="start-btn" onclick="startAR()">タップしてカメラとARを開始</button>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        const pillars = [];

        // センサー回転制御用の変数
        const euler = new THREE.Euler();
        const q0 = new THREE.Quaternion();
        const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90度 X軸回転（カメラの姿勢補正）

        async function initCamera() {
            const video = document.getElementById('camera-video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });
                    video.srcObject = fallbackStream;
                } catch (e) {
                    alert('カメラのアクセス許可が得られませんでした。');
                }
            }
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            // 5本の柱の配置（前後左右・遠近）
            const pillarConfigs = [
                { x: 0,    z: -30,  radius: 1.5, height: 120, color: 0x00ffff }, 
                { x: 120,  z: -250, radius: 4.0, height: 300, color: 0x33ffff }, 
                { x: -180, z: -350, radius: 5.5, height: 400, color: 0x00e5ff }, 
                { x: 80,   z: -500, radius: 7.0, height: 500, color: 0x66ffff }, 
                { x: -90,  z: -180, radius: 3.0, height: 250, color: 0x00c8ff }  
            ];

            pillarConfigs.forEach(config => {
                createPillar(config.x, config.z, config.radius, config.height, config.color);
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createPillar(x, z, radius, height, colorHex) {
            const pillarGroup = new THREE.Group();

            const geometry = new THREE.CylinderGeometry(radius, radius, height, 32, 1, true);
            const material = new THREE.MeshBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const cylinder = new THREE.Mesh(geometry, material);
            cylinder.position.y = height / 2;
            pillarGroup.add(cylinder);

            const coreGeo = new THREE.CylinderGeometry(radius * 0.3, radius * 0.3, height, 16, 1, true);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = height / 2;
            pillarGroup.add(core);

            pillarGroup.position.set(x, 0, z);
            scene.add(pillarGroup);

            pillars.push({
                group: pillarGroup,
                rotSpeed: 0.003 + Math.random() * 0.004
            });
        }

        async function startAR() {
            document.getElementById('start-btn').style.display = 'none';

            await initCamera();

            if (!scene) initThree();

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert('センサーアクセスの許可が必要です。');
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // 💡 上下左右の連動と水平保持を両立させるクォータニオン計算
        function handleOrientation(event) {
            if (event.alpha === null || event.beta === null || event.gamma === null) return;

            const alpha = THREE.MathUtils.degToRad(event.alpha); // 方位角（左右回転）
            const beta  = THREE.MathUtils.degToRad(event.beta);  // 前後傾き（上下パン）
            const gamma = THREE.MathUtils.degToRad(event.gamma); // 左右傾き（ロール）

            // 1. スマホの姿勢角を設定（回転順序: 'YXZ'）
            euler.set(beta, alpha, -gamma, 'YXZ');
            
            // 2. クォータニオンへ変換し、端末姿勢とThree.jsカメラ（-Z軸向き）の差分を補正
            q0.setFromEuler(euler);
            camera.quaternion.copy(q0);
            camera.quaternion.multiply(q1); // 立てて持った状態の基本軸補正
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            pillars.forEach(p => {
                p.group.rotation.y += p.rotSpeed;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
