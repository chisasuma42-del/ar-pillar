<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR実景合成 - 複数光柱シミュレーター</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
        }
        /* リアカメラの映像を表示する背景ビデオ */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        /* 3D描画キャンバス（カメラ映像の上に重ねる） */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        /* 案内UI */
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #ui h1 {
            font-size: 16px;
            margin: 0 0 4px 0;
            color: #00ffff;
        }
        #ui p {
            font-size: 12px;
            margin: 0;
            color: #ccc;
        }
        /* カメラ・センサー起動ボタン */
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            border: none;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            cursor: pointer;
            z-index: 100;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 背面カメラ表示用タグ -->
    <video id="camera-video" autoplay playsinline muted></video>

    <div id="ui">
        <h1>✨ AR実景合成イメージ</h1>
        <p>周囲にスマホを向けて景色の先の光を確認してください</p>
    </div>

    <button id="start-btn" onclick="startAR()">タップしてカメラとARを開始</button>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        const pillars = [];

        // 1. スマホの背面カメラを起動する関数
        async function initCamera() {
            const video = document.getElementById('camera-video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, // 背面カメラを指定
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                // 背面カメラの直接指定に失敗した場合は一般的なカメラを取得
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });
                    video.srcObject = fallbackStream;
                } catch (e) {
                    alert('カメラのアクセス許可が得られませんでした。');
                }
            }
        }

        // 2. 3D空間の初期化（背景透過設定）
        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 1.6, 0);

            // alpha: true で背景を透明にし、後ろのカメラ映像を透過させる
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            // 📍 5本の光の柱を配置
            const pillarConfigs = [
                { x: 0,    z: -30,  radius: 1.5, height: 120, color: 0x00ffff }, 
                { x: 120,  z: -250, radius: 4.0, height: 300, color: 0x33ffff }, 
                { x: -180, z: -350, radius: 5.5, height: 400, color: 0x00e5ff }, 
                { x: 80,   z: -500, radius: 7.0, height: 500, color: 0x66ffff }, 
                { x: -90,  z: -180, radius: 3.0, height: 250, color: 0x00c8ff }  
            ];

            pillarConfigs.forEach(config => {
                createPillar(config.x, config.z, config.radius, config.height, config.color);
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // 光の柱作成
        function createPillar(x, z, radius, height, colorHex) {
            const pillarGroup = new THREE.Group();

            const geometry = new THREE.CylinderGeometry(radius, radius, height, 32, 1, true);
            const material = new THREE.MeshBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const cylinder = new THREE.Mesh(geometry, material);
            cylinder.position.y = height / 2;
            pillarGroup.add(cylinder);

            const coreGeo = new THREE.CylinderGeometry(radius * 0.3, radius * 0.3, height, 16, 1, true);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = height / 2;
            pillarGroup.add(core);

            pillarGroup.position.set(x, 0, z);
            scene.add(pillarGroup);

            pillars.push({
                group: pillarGroup,
                rotSpeed: 0.003 + Math.random() * 0.004
            });
        }

        // 3. カメラ起動とセンサー設定を一括スタート
        async function startAR() {
            document.getElementById('start-btn').style.display = 'none';

            // カメラ映像のスタート
            await initCamera();

            // 3Dシーンの初期化
            if (!scene) initThree();

            // ジャイロセンサー（角度）の許可設定
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert('センサーアクセスの許可が必要です。');
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            if (!event.alpha && !event.beta && !event.gamma) return;

            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;

            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            pillars.forEach(p => {
                p.group.rotation.y += p.rotSpeed;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
