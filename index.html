<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>光の柱演出 - 方向シミュレーター</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050814;
            font-family: sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* 案内UI */
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #ui h1 {
            font-size: 16px;
            margin: 0 0 4px 0;
            color: #00ffff;
        }
        #ui p {
            font-size: 12px;
            margin: 0;
            color: #ccc;
        }
        /* iOS用のセンサー許可ボタン */
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            border: none;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            cursor: pointer;
            z-index: 100;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <h1>✨ 光の柱 演出イメージ</h1>
        <p>スマホをかざして周りを見回してください</p>
    </div>

    <button id="start-btn" onclick="initSensors()">タップして体験を開始</button>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, pillarGroup;
        let alphaOffset = 0; // 方角調整用
        
        // 1. 3D空間の初期化
        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            // 背景にうっすら星空のような霧を設定
            scene.fog = new THREE.FogExp2(0x050814, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0); // 人の目線の高さ

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 環境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // 床面（グリッド）で視覚的な方向感を与える
            const gridHelper = new THREE.GridHelper(200, 50, 0x00ffff, 0x223344);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // 光の柱を作成して配置
            createPillar();

            // ウィンドウサイズ変更対応
            window.addEventListener('resize', onWindowResize);

            // アニメーションループ開始
            animate();
        }

        // 2. 光の柱オブジェクトの作成
        function createPillar() {
            pillarGroup = new THREE.Group();

            // ① 柱本体（シリンダー）
            const geometry = new THREE.CylinderGeometry(1.5, 1.5, 100, 32, 1, true);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending // 幻想的な発光合成
            });
            const cylinder = new THREE.Mesh(geometry, material);
            cylinder.position.y = 50; // 地面から上に伸ばす
            pillarGroup.add(cylinder);

            // ② 芯となる強い光（中央の細い柱）
            const coreGeo = new THREE.CylinderGeometry(0.4, 0.4, 100, 16, 1, true);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = 50;
            pillarGroup.add(core);

            // ③ 根元の光るリング
            const ringGeo = new THREE.RingGeometry(0.5, 5, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.1;
            pillarGroup.add(ring);

            // 📍 柱を配置する位置（例：北方向・目線から15m先）
            // Z座標がマイナス方向がデフォルトの「北/正面」
            pillarGroup.position.set(0, 0, -15);
            scene.add(pillarGroup);
        }

        // 3. スマホの傾き・ジャイロセンサーの連動
        function initSensors() {
            document.getElementById('start-btn').style.display = 'none';

            // 3Dシーン開始
            if (!scene) initThree();

            // iOS 13+ のセンサー許可要求
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert('センサーへのアクセスが拒否されました。PCの場合はマウスで操作できます。');
                            enableMouseControls();
                        }
                    })
                    .catch(console.error);
            } else {
                // AndroidまたはPC
                window.addEventListener('deviceorientation', handleOrientation);
                enableMouseControls(); // PCフォールバック
            }
        }

        // センサーの角度をカメラに反映
        function handleOrientation(event) {
            if (!event.alpha && !event.beta && !event.gamma) return;

            // 方位角（alpha）、前後傾き（beta）、左右傾き（gamma）をラジアンに変換
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;

            // オイラー角を使ってカメラの回転を更新
            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        // PCブラウザ確認用のマウスドラッグ操作
        function enableMouseControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            document.addEventListener('mousedown', () => isDragging = true);
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
                camera.rotation.y -= deltaMove.x * 0.005;
                camera.rotation.x -= deltaMove.y * 0.005;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 描画フレームごとのアニメーション（柱をゆらゆら光らせる）
        function animate() {
            requestAnimationFrame(animate);

            if (pillarGroup) {
                // 柱をゆっくり回転させて神秘的な動きを出す
                pillarGroup.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
