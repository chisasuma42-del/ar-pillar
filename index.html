<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR実景合成 - 柱1本・垂直固定版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; color: #fff; }
        #camera-video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        #ui {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); padding: 12px 24px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2); text-align: center; pointer-events: none; z-index: 10;
        }
        #ui h1 { font-size: 16px; margin: 0 0 4px 0; color: #00ffff; }
        #ui p { font-size: 12px; margin: 0; color: #ccc; }
        #debug-info {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px;
            font-family: monospace; font-size: 12px; color: #00ff00; z-index: 200; pointer-events: none;
        }
        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 16px 32px; font-size: 18px; font-weight: bold;
            background: linear-gradient(135deg, #00ffff, #0088ff); color: #000;
            border: none; border-radius: 50px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            cursor: pointer; z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <video id="camera-video" autoplay playsinline muted></video>

    <div id="ui">
        <h1>✨ 光の柱 演出シミュレーター</h1>
        <p>正面の方角を向いて光の柱を確認してください</p>
    </div>

    <div id="debug-info">
        Status: ボタンを押してください
    </div>

    <button id="start-btn" onclick="startAR()">タップして開始</button>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, mainPillar;
        const debugElem = document.getElementById('debug-info');

        let targetYaw = 0;
        let targetPitch = 0;
        let currentYaw = 0;
        let currentPitch = 0;
        let rawAlpha = 0, rawBeta = 0;

        function startAR() {
            document.getElementById('start-btn').style.display = 'none';

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            debugElem.innerHTML = "STATUS: センサー許可完了";
                            initSystem();
                        } else {
                            debugElem.innerHTML = "STATUS: センサー許可拒否";
                        }
                    })
                    .catch(err => { debugElem.innerHTML = "ERROR: " + err; });
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
                initSystem();
            }
        }

        async function initSystem() {
            await initCamera();
            if (!scene) initThree();
        }

        async function initCamera() {
            const video = document.getElementById('camera-video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                } catch (e) {
                    alert('カメラの許可が得られませんでした。');
                }
            }
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            // 📍 柱を1本だけ作成（正面・約30m先）
            createSinglePillar();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // 象徴的な1本の光の柱を作成
        function createSinglePillar() {
            mainPillar = new THREE.Group();

            const radius = 2.5;
            const height = 200;

            // ① 外殻の発光シリンダー
            const geometry = new THREE.CylinderGeometry(radius, radius, height, 32, 1, true);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.65,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const cylinder = new THREE.Mesh(geometry, material);
            cylinder.position.y = height / 2;
            mainPillar.add(cylinder);

            // ② 芯の強い光
            const coreGeo = new THREE.CylinderGeometry(radius * 0.3, radius * 0.3, height, 16, 1, true);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = height / 2;
            mainPillar.add(core);

            // ③ 地面の光るリング
            const ringGeo = new THREE.RingGeometry(0.5, radius * 3, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.1;
            mainPillar.add(ring);

            // 正面（Z: -30）に配置
            mainPillar.position.set(0, 0, -30);
            scene.add(mainPillar);
        }

        function handleOrientation(event) {
            let alpha = event.alpha || 0;
            let beta = event.beta || 0;

            if (event.webkitCompassHeading) {
                alpha = event.webkitCompassHeading;
            }

            rawAlpha = alpha;
            rawBeta = beta;

            // 💡 左右パン（Yaw）と上下パン（Pitch）のみ取得（傾き/ロールは0に固定）
            targetYaw = THREE.MathUtils.degToRad(-alpha);
            targetPitch = THREE.MathUtils.degToRad(beta - 90);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // スムーズな角度補完
            currentYaw += (targetYaw - currentYaw) * 0.15;
            currentPitch += (targetPitch - currentPitch) * 0.15;

            // 💡 ロール角（Z軸回転）を常に 0 に固定することで柱の斜め傾きを完全に防止
            camera.rotation.set(currentPitch, currentYaw, 0, 'YXZ');

            if (debugElem) {
                debugElem.innerHTML = `STATUS: 動作中（柱1本・垂直固定版）<br>方角: ${Math.round(rawAlpha)}°<br>傾き: ${Math.round(rawBeta)}°`;
            }

            if (mainPillar) mainPillar.rotation.y += 0.005;
            if (scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
