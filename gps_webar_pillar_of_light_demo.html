<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GPS WebAR 光の柱 デモ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #030712;
            color: #f9fafb;
            overflow: hidden;
            touch-action: none;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(10, 15, 30, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .glass-btn.active {
            background: rgba(59, 130, 246, 0.45);
            border-color: rgba(96, 165, 250, 0.8);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Compass Rose Pulsing */
        @keyframes ringPulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        .pulse-anim {
            animation: ringPulse 2.5s infinite ease-in-out;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }
    </style>
</head>
<body class="w-screen h-screen relative select-none">

    <!-- CAMERA FEED BACKGROUND -->
    <video id="webcam" class="absolute inset-0 w-full h-full object-cover hidden" autoplay playsinline muted></video>
    
    <!-- THREE.JS CANVAS CONTAINER -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full"></div>

    <!-- COMPASS DIRECTION GUIDANCE OVERLAY -->
    <div id="target-radar-container" class="absolute top-20 left-1/2 -translate-x-1/2 pointer-events-none z-10 flex flex-col items-center">
        <!-- Arrow pointing to target -->
        <div id="radar-arrow" class="w-12 h-12 flex items-center justify-center transition-transform duration-200">
            <i data-lucide="navigation" class="w-10 h-10 text-cyan-400 drop-shadow-[0_0_12px_rgba(34,211,238,0.8)]"></i>
        </div>
        <div class="glass-panel px-3 py-1 rounded-full mt-1 text-[11px] font-mono text-cyan-300 border-cyan-500/30 flex items-center gap-1.5 shadow-lg">
            <span>石像の方角:</span>
            <span id="target-bearing-text" class="font-bold text-white">---°</span>
            <span class="text-slate-400">|</span>
            <span>距離:</span>
            <span id="target-distance-text" class="font-bold text-amber-300">--- m</span>
        </div>
    </div>

    <!-- TOP HEADER BAR -->
    <header class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-20 pointer-events-none">
        <!-- Logo & App Title -->
        <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 pointer-events-auto">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-amber-300 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <i data-lucide="map-pin" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h1 class="text-xs font-bold bg-gradient-to-r from-white via-cyan-100 to-amber-200 bg-clip-text text-transparent">
                    GPS Location AR 光の柱
                </h1>
                <p class="text-[10px] text-slate-400 font-mono">遠距離対応 透過光柱サンプル</p>
            </div>
        </div>

        <!-- Controls / iOS Orientation Permission -->
        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="btn-ios-permission" class="hidden glass-btn px-3 py-2 rounded-2xl text-xs text-amber-300 border-amber-400/40 font-semibold animate-bounce flex items-center gap-1.5">
                <i data-lucide="compass" class="w-4 h-4"></i>
                <span>コンパスを許可</span>
            </button>
            <div class="glass-panel px-3 py-1.5 rounded-2xl flex items-center gap-2 text-xs">
                <span id="gps-status-dot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                <span id="gps-status-text" class="text-slate-300 font-mono text-[11px]">GPS未取得</span>
            </div>
        </div>
    </header>

    <!-- BOTTOM CONTROLS & SETTINGS DRAWER TOGGLE -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 pointer-events-auto">
        <button id="btn-toggle-settings" class="glass-btn px-5 py-3 rounded-2xl text-slate-200 flex items-center gap-2 font-medium text-xs hover:border-cyan-400/50 shadow-lg">
            <i data-lucide="sliders" class="w-4 h-4 text-cyan-400"></i>
            <span>石像の緯度経度・調整設定</span>
        </button>
        <button id="btn-recenter" class="glass-btn p-3 rounded-2xl text-slate-200 hover:text-cyan-300" title="現在地・方角を再計算">
            <i data-lucide="locate-fixed" class="w-5 h-5 text-cyan-400"></i>
        </button>
    </div>

    <!-- FLOATING SETTINGS PANEL -->
    <div id="settings-panel" class="glass-panel absolute bottom-24 left-1/2 -translate-x-1/2 z-30 w-[92%] max-w-lg rounded-3xl p-5 transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-none">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-white/10">
            <h2 class="text-xs font-bold text-slate-200 flex items-center gap-2">
                <i data-lucide="map-pin" class="w-4 h-4 text-cyan-400"></i>
                目標位置（石像）＆ コンパス補正設定
            </h2>
            <button id="btn-close-settings" class="text-slate-400 hover:text-white p-1">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1 text-slate-200">
            <!-- Target Coordinates Inputs -->
            <div class="p-3 bg-slate-900/60 rounded-2xl border border-white/5 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-[11px] font-bold text-cyan-300 flex items-center gap-1">
                        <i data-lucide="crosshair" class="w-3.5 h-3.5"></i> 石像の座標（目標緯度・経度）
                    </span>
                    <button id="btn-preset-tokyo" class="text-[10px] text-amber-400 hover:underline">サンプル（東京タワー）</button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">目標 緯度 (Latitude)</label>
                        <input type="number" step="0.000001" id="input-target-lat" value="35.658581" class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-cyan-300 font-mono focus:outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">目標 経度 (Longitude)</label>
                        <input type="number" step="0.000001" id="input-target-lng" value="139.745433" class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-cyan-300 font-mono focus:outline-none focus:border-cyan-400">
                    </div>
                </div>
            </div>

            <!-- Compass Fine Tuning Slider -->
            <div class="p-3 bg-slate-900/60 rounded-2xl border border-white/5 space-y-2">
                <div class="flex justify-between text-[11px]">
                    <span class="text-slate-300 flex items-center gap-1">
                        <i data-lucide="compass" class="w-3.5 h-3.5 text-amber-400"></i> コンパス方位の微調整 (Offset)
                    </span>
                    <span id="heading-offset-val" class="font-mono text-amber-400">+0.0°</span>
                </div>
                <input type="range" id="input-heading-offset" min="-45" max="45" step="0.5" value="0" class="w-full accent-amber-400 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                <p class="text-[9px] text-slate-400">スマホの電子コンパスの向きが実際の建物とずれている場合はここで左右に微調整してください。</p>
            </div>

            <!-- Indoor / Manual Simulation Controls -->
            <div class="p-3 bg-slate-900/60 rounded-2xl border border-white/5 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-bold text-slate-300 flex items-center gap-1">
                        <i data-lucide="flask-conical" class="w-3.5 h-3.5 text-purple-400"></i> 室内・手動シミュレーション
                    </span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-sim-mode" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-600"></div>
                    </label>
                </div>

                <div id="sim-controls" class="space-y-3 opacity-50 pointer-events-none transition-opacity">
                    <div>
                        <div class="flex justify-between text-[10px] mb-1">
                            <span>仮想距離 (Distance)</span>
                            <span id="sim-dist-val" class="font-mono text-purple-300">150 m</span>
                        </div>
                        <input type="range" id="input-sim-dist" min="10" max="1000" step="10" value="150" class="w-full accent-purple-400 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] mb-1">
                            <span>カメラの相対向く角度 (Relative Angle)</span>
                            <span id="sim-angle-val" class="font-mono text-purple-300">0° (正面)</span>
                        </div>
                        <input type="range" id="input-sim-angle" min="-180" max="180" step="2" value="0" class="w-full accent-purple-400 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Pillar Color Selection -->
            <div>
                <label class="block text-[11px] font-semibold text-slate-300 mb-2">光の柱のカラー</label>
                <div class="grid grid-cols-4 gap-2">
                    <button data-color="#fbbf24" class="color-preset glass-btn py-2 rounded-xl flex flex-col items-center gap-1 active border-amber-400">
                        <span class="w-3.5 h-3.5 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24]"></span>
                        <span class="text-[9px]">神聖ゴールド</span>
                    </button>
                    <button data-color="#38bdf8" class="color-preset glass-btn py-2 rounded-xl flex flex-col items-center gap-1">
                        <span class="w-3.5 h-3.5 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]"></span>
                        <span class="text-[9px]">神秘シアン</span>
                    </button>
                    <button data-color="#f43f5e" class="color-preset glass-btn py-2 rounded-xl flex flex-col items-center gap-1">
                        <span class="w-3.5 h-3.5 rounded-full bg-rose-500 shadow-[0_0_8px_#f43f5e]"></span>
                        <span class="text-[9px]">鳳凰の紅</span>
                    </button>
                    <button data-color="#10b981" class="color-preset glass-btn py-2 rounded-xl flex flex-col items-center gap-1">
                        <span class="w-3.5 h-3.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#10b981]"></span>
                        <span class="text-[9px]">翡翠グリーン</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="glass-panel fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl flex items-center gap-2.5 transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none border-cyan-500/30">
        <i data-lucide="info" class="w-4 h-4 text-cyan-400"></i>
        <span id="toast-msg" class="text-xs text-slate-200 font-medium">GPS位置情報の取得を開始しました</span>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // App State
        const state = {
            // Target Statue GPS (Default: Tokyo Tower or user set)
            targetLat: 35.658581,
            targetLng: 139.745433,
            
            // User Realtime GPS
            userLat: null,
            userLng: null,
            userAccuracy: 0,
            
            // Angles and Distances
            targetDistance: 150, // in meters
            targetBearing: 0,   // degrees from North
            deviceHeading: 0,   // Compass direction device is facing
            headingOffset: 0,   // Manual calibration offset
            
            // Simulation Mode
            isSimMode: false,
            simDistance: 150,
            simAngle: 0,
            
            // Light Pillar Aesthetics
            pillarColor: '#fbbf24',
            pillarHeight: 1200, // 1.2km high for long distance visibility
            pillarRadius: 15,    // Base scale in meters
            
            // Systems
            cameraActive: false
        };

        // Three.js Core
        let scene, camera, renderer;
        let pillarGroup, outerCylinder, innerCore, groundAura, particles;

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initThreeJS();
            setupUI();
            startCameraAndSensors();
            animate();
        });

        // --- THREE.JS SCENE SETUP ---
        function initThreeJS() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            // Camera with FAR CLIP PLANE set to 5000m to render far pillars
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 1.6, 0); // Eye height

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Light Pillar Group
            pillarGroup = new THREE.Group();
            scene.add(pillarGroup);

            buildGiantPillarOfLight();

            window.addEventListener('resize', onWindowResize);
        }

        function buildGiantPillarOfLight() {
            // 1. Outer Translucent Cylinder (Additive Blending)
            const outerGeo = new THREE.CylinderGeometry(state.pillarRadius, state.pillarRadius * 1.5, state.pillarHeight, 32, 1, true);
            outerGeo.translate(0, state.pillarHeight / 2, 0);

            const outerMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color(state.pillarColor),
                transparent: true,
                opacity: 0.55,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            outerCylinder = new THREE.Mesh(outerGeo, outerMat);
            pillarGroup.add(outerCylinder);

            // 2. Dense Inner White Core
            const coreGeo = new THREE.CylinderGeometry(state.pillarRadius * 0.25, state.pillarRadius * 0.4, state.pillarHeight, 16, 1, true);
            coreGeo.translate(0, state.pillarHeight / 2, 0);

            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.85,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            innerCore = new THREE.Mesh(coreGeo, coreMat);
            pillarGroup.add(innerCore);

            // 3. Ground Base Ring Aura
            const auraGeo = new THREE.RingGeometry(1, state.pillarRadius * 3, 64);
            const auraMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color(state.pillarColor),
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            groundAura = new THREE.Mesh(auraGeo, auraMat);
            groundAura.rotation.x = -Math.PI / 2;
            groundAura.position.y = 0.2;
            pillarGroup.add(groundAura);

            // 4. Rising Spark Particles
            const particleCount = 250;
            const pGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const speeds = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * state.pillarRadius * 2.0;
                positions[i * 3] = Math.cos(angle) * r;
                positions[i * 3 + 1] = Math.random() * (state.pillarHeight * 0.4);
                positions[i * 3 + 2] = Math.sin(angle) * r;
                speeds[i] = 1.0 + Math.random() * 2.5;
            }

            pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            pGeo.setAttribute('speed', new THREE.BufferAttribute(speeds, 1));

            const pMat = new THREE.PointsMaterial({
                color: new THREE.Color(state.pillarColor),
                size: 2.5,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(pGeo, pMat);
            pillarGroup.add(particles);

            // Default initial placement (150m ahead)
            pillarGroup.position.set(0, -10, -state.simDistance);
        }

        // --- GEOLOCATION & MATHEMATICS ---
        // Haversine formula to compute distance in meters between two GPS coordinates
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Earth radius in meters
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Calculate initial bearing angle (0 - 360 deg) from User to Statue
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            const θ = Math.atan2(y, x);
            return (θ * 180 / Math.PI + 360) % 360;
        }

        // --- SENSOR INTEGRATION ---
        function startCameraAndSensors() {
            // 1. Live Camera Stream
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                }).then(stream => {
                    const video = document.getElementById('webcam');
                    video.srcObject = stream;
                    video.classList.remove('hidden');
                    state.cameraActive = true;
                }).catch(err => {
                    console.warn("Camera fallback:", err);
                    showToast("カメラフィードの起動に失敗しました（シミュレーション背景）");
                });
            }

            // 2. GPS Location Tracking
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        state.userLat = pos.coords.latitude;
                        state.userLng = pos.coords.longitude;
                        state.userAccuracy = pos.coords.accuracy;

                        const dot = document.getElementById('gps-status-dot');
                        dot.classList.remove('bg-slate-500', 'bg-amber-400');
                        dot.classList.add('bg-emerald-400');
                        document.getElementById('gps-status-text').innerText = `GPS精度: ±${Math.round(state.userAccuracy)}m`;

                        updateARProjection();
                    },
                    (err) => {
                        console.warn("GPS Error:", err);
                        const dot = document.getElementById('gps-status-dot');
                        dot.classList.add('bg-amber-400');
                        document.getElementById('gps-status-text').innerText = "GPS手動/待機中";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }

            // 3. Device Orientation (Compass Heading)
            if (window.DeviceOrientationEvent) {
                // iOS 13+ permission check
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const iosBtn = document.getElementById('btn-ios-permission');
                    iosBtn.classList.remove('hidden');
                    iosBtn.addEventListener('click', () => {
                        DeviceOrientationEvent.requestPermission().then(response => {
                            if (response === 'granted') {
                                iosBtn.classList.add('hidden');
                                window.addEventListener('deviceorientation', handleOrientation, true);
                            }
                        });
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
            }
        }

        function handleOrientation(e) {
            let heading = 0;
            if (e.webkitCompassHeading) {
                // iOS Compass Heading
                heading = e.webkitCompassHeading;
            } else if (e.alpha !== null) {
                // Android Compass (relative/absolute)
                heading = (360 - e.alpha) % 360;
            }

            state.deviceHeading = heading;
            updateARProjection();
        }

        // --- AR POSITION PROJECTION MATH ---
        function updateARProjection() {
            let dist = state.simDistance;
            let relAngle = state.simAngle;

            if (!state.isSimMode && state.userLat !== null && state.userLng !== null) {
                // REAL GPS COMPUTATION
                state.targetDistance = calculateDistance(state.userLat, state.userLng, state.targetLat, state.targetLng);
                state.targetBearing = calculateBearing(state.userLat, state.userLng, state.targetLat, state.targetLng);

                dist = state.targetDistance;

                // Relative angle between camera facing direction and target direction
                const effectiveHeading = (state.deviceHeading + state.headingOffset + 360) % 360;
                relAngle = (state.targetBearing - effectiveHeading + 360) % 360;
                if (relAngle > 180) relAngle -= 360;
            }

            // Update Header Display Texts
            document.getElementById('target-distance-text').innerText = `${Math.round(dist)} m`;
            document.getElementById('target-bearing-text').innerText = `${Math.round(state.targetBearing)}°`;

            // Update Direction Arrow Rotation
            const arrow = document.getElementById('radar-arrow');
            arrow.style.transform = `rotate(${relAngle}deg)`;

            // Project 3D Pillar Position relative to Camera (0,0,0)
            const angleRad = (relAngle * Math.PI) / 180;
            
            // 3D Coordinates: X (right), Z (depth towards camera is positive, so -cos for forward)
            const x = Math.sin(angleRad) * dist;
            const z = -Math.cos(angleRad) * dist;

            // Height scaling adjustment based on distance so it remains impactful
            if (pillarGroup) {
                pillarGroup.position.set(x, -15, z);
            }
        }

        // --- STREAMING_CHUNK:Configuring GUI event listeners and controls... ---
        function setupUI() {
            const panel = document.getElementById('settings-panel');
            const btnToggle = document.getElementById('btn-toggle-settings');
            const btnClose = document.getElementById('btn-close-settings');

            const togglePanel = (show) => {
                if (show) {
                    panel.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                    panel.classList.add('opacity-100', 'translate-y-0');
                } else {
                    panel.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                    panel.classList.remove('opacity-100', 'translate-y-0');
                }
            };

            btnToggle.addEventListener('click', () => togglePanel(true));
            btnClose.addEventListener('click', () => togglePanel(false));

            // Coordinates Inputs
            const inputLat = document.getElementById('input-target-lat');
            const inputLng = document.getElementById('input-target-lng');

            const onCoordChange = () => {
                state.targetLat = parseFloat(inputLat.value) || 35.658581;
                state.targetLng = parseFloat(inputLng.value) || 139.745433;
                updateARProjection();
            };

            inputLat.addEventListener('change', onCoordChange);
            inputLng.addEventListener('change', onCoordChange);

            // Tokyo Tower Preset Button
            document.getElementById('btn-preset-tokyo').addEventListener('click', () => {
                inputLat.value = 35.658581;
                inputLng.value = 139.745433;
                onCoordChange();
                showToast("東京タワーの座標を設定しました");
            });

            // Heading Offset Slider
            document.getElementById('input-heading-offset').addEventListener('input', (e) => {
                state.headingOffset = parseFloat(e.target.value);
                document.getElementById('heading-offset-val').innerText = `${state.headingOffset >= 0 ? '+' : ''}${state.headingOffset.toFixed(1)}°`;
                updateARProjection();
            });

            // Simulation Toggle & Sliders
            const toggleSim = document.getElementById('toggle-sim-mode');
            const simControls = document.getElementById('sim-controls');

            toggleSim.addEventListener('change', (e) => {
                state.isSimMode = e.target.checked;
                if (state.isSimMode) {
                    simControls.classList.remove('opacity-50', 'pointer-events-none');
                    showToast("室内シミュレーションモードON");
                } else {
                    simControls.classList.add('opacity-50', 'pointer-events-none');
                    showToast("リアルGPSモード切替");
                }
                updateARProjection();
            });

            document.getElementById('input-sim-dist').addEventListener('input', (e) => {
                state.simDistance = parseFloat(e.target.value);
                document.getElementById('sim-dist-val').innerText = `${state.simDistance} m`;
                updateARProjection();
            });

            document.getElementById('input-sim-angle').addEventListener('input', (e) => {
                state.simAngle = parseFloat(e.target.value);
                document.getElementById('sim-angle-val').innerText = `${state.simAngle}°`;
                updateARProjection();
            });

            // Pillar Color Preset
            document.querySelectorAll('.color-preset').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.color-preset').forEach(b => b.classList.remove('active', 'border-amber-400'));
                    const target = e.currentTarget;
                    target.classList.add('active', 'border-amber-400');

                    state.pillarColor = target.getAttribute('data-color');
                    updatePillarColor();
                });
            });

            document.getElementById('btn-recenter').addEventListener('click', () => {
                updateARProjection();
                showToast("表示位置を再ロードしました");
            });
        }

        function updatePillarColor() {
            const col = new THREE.Color(state.pillarColor);
            if (outerCylinder) outerCylinder.material.color = col;
            if (groundAura) groundAura.material.color = col;
            if (particles) particles.material.color = col;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001;

            // Pulsing animation for outer light pillar
            if (outerCylinder) {
                const pulse = Math.sin(time * 3) * 0.08 + 1.0;
                outerCylinder.scale.set(pulse, 1, pulse);
            }

            // Ground Aura Rotating Shockwave
            if (groundAura) {
                groundAura.rotation.z += 0.005;
            }

            // Particle Upward Movement
            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const speeds = particles.geometry.attributes.speed.array;

                for (let i = 0; i < 250; i++) {
                    positions[i * 3 + 1] += speeds[i];
                    if (positions[i * 3 + 1] > state.pillarHeight * 0.4) {
                        positions[i * 3 + 1] = 0;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
